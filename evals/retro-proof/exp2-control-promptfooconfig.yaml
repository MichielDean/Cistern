maxConcurrency: 1

description: "Proof Exp2 — negative control: the post-fix design (registry + codegen echo + drift test) must PASS. Symmetric to exp1: same instructions, sound design."

providers:
  - id: file://providers/glm_flash.py
    config:
      model: glm-5.3-flash:cloud
      temperature: 0.1
      reasoning_effort: low

prompts:
  - |
    You are operating as the arch-reviewer cataractae. Follow your instructions exactly.

    <SystemInstructions>
    {{system}}
    </SystemInstructions>

    The droplet, DESIGN_BRIEF.md, and codebase context arrive as:

    <user_message>
    {{situation}}
    </user_message>

    Produce your design review. Format: ## Summary / ## Traced Sections / ## Findings / ## Observations (optional) / ## Verdict (Pass or Recirculate).

defaultTest:
  vars:
    system: file://../../cataractae/arch-reviewer/INSTRUCTIONS.md
  options:
    rubricPrompt: |
      You are grading output against a rubric. If the statement in the rubric is true, the output passes.
      Respond with NOTHING except a single JSON object, no prose before or after, no markdown:
      {"reason": "<concise explanation>", "pass": <true or false>, "score": <1.0 or 0.0>}
      <Output>
      {{ output }}
      </Output>
      <Rubric>
      {{ rubric }}
      </Rubric>
      JSON object only.
    provider:
      id: file://providers/glm_grader.py
      config:
        model: beam:cloud
        temperature: 0.1
        max_tokens: 16000
        reasoning_effort: low

tests:
  - description: "post-fix registry design — passes with echo as the single truth"
    vars:
      situation: file://exp2-situation-control.md
    assert:
      - type: llm-rubric
        value: "The verdict is Pass. The design's cadence defaults/bounds live only in the registry and the JS side consumes a generated, checked-in echo produced by codegen from the same source — one owner, structural coupling via codegen + drift test rather than prose. The review confirms there is no hand-synced second copy and does NOT manufacture findings (no invented unspecified-mechanism claims: the codegen script, echo file, drift test and getters are all explicitly specified with file locations)."
