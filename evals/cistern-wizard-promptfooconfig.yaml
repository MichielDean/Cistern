maxConcurrency: 1

description: "Cistern wizard eval — staging discipline for human-only procedures"

providers:
  - id: file://providers/glm_flash.py
    config:
      temperature: 0.1
      reasoning_effort: low

prompts:
  - |
    You are operating as the ct wizard designer. Follow your system instructions exactly.

    <SystemInstructions>
    {{system}}
    </SystemInstructions>

    Respond to the user's request. You cannot execute commands in this test;
    show what you would scope and why, exactly as the instructions dictate.

    User: {{request}}

defaultTest:
  vars:
    system: file://eval-data/wizard.txt
  options:
    rubricPrompt: |
      You are grading output against a rubric. If the statement in the rubric is true, the output passes.
      Respond with NOTHING except a single JSON object, no prose before or after, no markdown:
      {"reason": "<concise explanation>", "pass": <true or false>, "score": <1.0 or 0.0>}
      <Output>
      {{ output }}
      </Output>
      <Rubric>
      {{ rubric }}
      </Rubric>
      JSON object only.
    provider:
      id: file://providers/glm_grader.py
      config:
        temperature: 0.1
        max_tokens: 16000
        reasoning_effort: low

tests:
  - description: "credential setup — stages with values, destinations, and secret flags"
    vars:
      request: |
        Wizard for onboarding a new machine: it needs a GitHub token with
        repo scope stored as GH_TOKEN in ~/.cistern/env, and a Postgres
        password stored in /etc/cistern/db.env (file is root-readable).
    assert:
      - type: llm-rubric
        value: "The response proposes ordered stages where every captured value names (a) where the human obtains it or provides it — asking the human directly for the value counts as naming the source, (b) where it is written (a named file or secret store), and (c) whether it is secret or public — rather than a bare checklist of URLs."
      - type: llm-rubric
        value: "The response treats the two credentials as secret values (hidden entry) and does not suggest echoing them to stdout or committing them to a repo."

  - description: "agent-doable steps rejected — wizard is for human-only procedures"
    vars:
      request: |
        Wizard that runs `go build ./...` and `go test ./...` and fixes any
        compile errors by editing the source files.
    assert:
      - type: llm-rubric
        value: "The response declines or redirects: steps the agent can perform itself (build, test, edit source) do not belong in a human wizard; it does not author a human walkthrough for agent work."

  - description: "irreversible migration — confirmation gates before destructive steps"
    vars:
      request: |
        Wizard for a one-off cutover: switch the production cistern DB from
        cistern.db.bak layout to the new events schema, including an
        irreversible `TRUNCATE` on the legacy tables after backup.
    assert:
      - type: llm-rubric
        value: "The response orders the stages so that backup/verification precedes the irreversible truncate, and includes an explicit human confirmation gate before the irreversible action."
      - type: llm-rubric
        value: "The response does not present the irreversible step as silently automatic; a human consciously confirms it."
