maxConcurrency: 1

description: "Implementer cataractae eval — proves the implementer honors the brief as a contract and uses TDD"

providers:
  - id: file://providers/glm_flash.py
    config:
      temperature: 0.1
      reasoning_effort: low

prompts:
  - |
    You are operating as the implementer cataractae. Follow your instructions exactly.

    <SystemInstructions>
    {{system}}
    </SystemInstructions>

    The droplet, DESIGN_BRIEF.md, and codebase context arrive as:

    <user_message>
    {{situation}}
    </user_message>

    Produce your outcome notes describing what you implemented. Format: outcome notes as you would write them for the droplet log.

defaultTest:
  vars:
    system: file://../cataractae/implementer/INSTRUCTIONS.md
  options:
    rubricPrompt: |
      You are grading output against a rubric. If the statement in the rubric is true, the output passes.
      Respond with NOTHING except a single JSON object, no prose before or after, no markdown:
      {"reason": "<concise explanation>", "pass": <true or false>, "score": <1.0 or 0.0>}
      <Output>
      {{ output }}
      </Output>
      <Rubric>
      {{ rubric }}
      </Rubric>
      JSON object only.
    provider:
      id: file://providers/glm_flash.py
      config:
        temperature: 0.1
        max_tokens: 16000
        reasoning_effort: low

tests:
  - description: "brief with API Surface Checklist — implementer addresses each item"
    vars:
      situation: |
        Droplet: "Add a Notifier struct that sends webhooks on droplet stage changes."
        DESIGN_BRIEF.md API Surface Checklist:
          - [ ] Notifier.Send returns nil on success, wraps context errors with 'notifier:' prefix,
                and never returns a bare io.EOF without wrapping it
          - [ ] Notifier.Send requires no prior initialization — the constructor leaves
                the client in a fully usable state (no initClient/setXxx pattern)
        Codebase: Go, existing patterns in internal/castellarius/dispatch.go.
    assert:
      - type: llm-rubric
        value: "The outcome notes confirm each API Surface Checklist item is addressed — either the implementation satisfies it OR an issue was filed explaining why it cannot. The implementer does NOT silently skip a checklist item."
      - type: llm-rubric
        value: "The outcome notes mention TDD — tests were written before implementation (red then green), not implementation-first."

  - description: "brief with DRY requirement — implementer extracts the named helper"
    vars:
      situation: |
        Droplet: "Add permission boolean columns to Organization settings."
        DESIGN_BRIEF.md DRY Requirements:
          Extract `scanPermFromNullable(rows sql.Rows, col string) (sql.NullString, error)`
          from the inline pattern at cmd/ct/permission.go lines 45, 52, 59, 66, 73, 80, 87, 94, 101, 108, 115, 122, 129.
        The inline NullString scan block appears 12 times.
    assert:
      - type: llm-rubric
        value: "The outcome notes confirm the helper `scanPermFromNullable` (or the named helper from the brief) was extracted and the inline pattern no longer appears 12 times. The implementer used Grep to verify, not just claimed it."

  - description: "rewrite droplet — implementer verifies migration compatibility"
    vars:
      situation: |
        Droplet: "Rewrite the llmem CLI in Go. Existing tool is Python, stores memories in SQLite.
        Users have existing databases with data that must work with the new version."
        DESIGN_BRIEF.md Migration Surface Analysis:
          Existing Python databases use sqlite3 with a 'memories' table.
          The new Go code must open these databases and core operations must work.
    assert:
      - type: llm-rubric
        value: "The outcome notes confirm migration compatibility was verified — the implementer tested against a pre-existing database (not just a fresh t.TempDir database). 'Tests pass on a fresh database' is NOT sufficient for a rewrite."

  - description: "brief with forbidden pattern — implementer avoids it"

    vars:
      situation: |
        Droplet: "Add a new HTTP client for the Jira API."
        DESIGN_BRIEF.md Forbidden Patterns:
          - Lazy initialization (initClient pattern) — use eager constructor initialization
          - SetXxx mutation methods for testing — use constructor injection via config fields
        Codebase: existing HTTP clients in internal/castellarius/ use constructor injection.
    assert:
      - type: llm-rubric
        value: "The outcome notes confirm the implementation uses eager constructor initialization (no initClient/ensureConnected pattern) and constructor injection for config (no SetXxx mutation methods). The implementer did NOT use the forbidden patterns."

  - description: "brief gaps droplet vs brief — implementer files an issue before implementing"
    vars:
      situation: |
        Droplet: "Add webhook notifications for droplet stage changes. Must work with existing config files from v1.2."
        DESIGN_BRIEF.md: (no migration compatibility section — the brief omitted it even though the droplet asks for backward compat with v1.2 config files).
        The droplet asks for backward compatibility; the brief does not address it.
    assert:
      - type: llm-rubric
        value: "The implementer files an issue with `ct droplet issue add` BEFORE implementing (explaining the brief omits the backward-compat requirement the droplet asks for). The implementer does NOT silently implement around the gap."

  - description: "sibling test helper exists — implementer reuses it instead of duplicating preambles"
    vars:
      situation: |
        Droplet: "Add a SlackNotifier implementing the Notifier interface."
        DESIGN_BRIEF.md DRY Requirements:
          The package already has a helper `newTestNotifier(t)` in internal/notifier/internal_test.go
          that builds a configured notifier against an httptest server.
        The tests you will write (internal/notifier/slack_test.go) need the same setup.
    assert:
      - type: llm-rubric
        value: "The outcome notes confirm the implementer found and reused the existing test helper from the sibling test file (Grep before writing tests) rather than duplicating the Resolve+construct preamble in the new test file."

  - description: "misconfiguration surfaceable at construction — implementer validates at construction time"
    vars:
      situation: |
        Droplet: "Add a SlackNotifier. Webhook URL and rate limit come from config."
        DESIGN_BRIEF.md Contract Requirements:
          Constructors leave the object fully usable: validate the webhook URL format and
          that the rate limit is positive at construction, and report misconfiguration
          with a wrapped error at that point — not at first Send.
    assert:
      - type: llm-rubric
        value: "The outcome notes confirm the implementer validates configuration at construction time (invalid URL or non-positive rate limit returns a wrapped error from the constructor), and does not defer misconfiguration to first use."

  - description: "upstream diagnostic error body — implementer captures it into the error"
    vars:
      situation: |
        Droplet: "Add a SlackNotifier that posts to Slack's Webhook API."
        DESIGN_BRIEF.md Error Message Requirements:
          Non-2xx responses from Slack carry a diagnostic body (e.g. channel_not_found,
          invalid_payload) that operators debug from. Errors must include the remote's
          own message, wrapped with the 'notifier:' prefix.
    assert:
      - type: llm-rubric
        value: "The outcome notes confirm the implementer reads the upstream response body on error status and includes it in the returned wrapped error, so operators see Slack's diagnostic message rather than just an HTTP status code."

  - description: "work already applied — implementer signals pass immediately instead of duplicating"
    vars:
      situation: |
        Droplet: "Add a SlackNotifier with rate-limited sends."
        Reading CONTEXT.md and the worktree diff shows the implementation is already
        present and tests pass — the change was applied in a prior cycle that was
        recirculated for delivery issues only.
    assert:
      - type: llm-rubric
        value: "The implementer signals pass immediately — the outcome notes state the change is already applied and no new implementation was duplicated."
